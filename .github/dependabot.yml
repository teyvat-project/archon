version: 2
updates:
  - package-ecosystem: github-actions
    # "/" also covers the local composite actions under .github/actions.
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    # pnpm workspace: the root lockfile covers every package.
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-development:
        dependency-type: development
      npm-production:
        dependency-type: production

  - package-ecosystem: gradle
    # The generated SDK's versions live in packages/archon/src/plugins/kotlin/project.ts; the plugin's versions test
    # fails until that file is bumped to match these builds.
    directories: ['/runtimes/kotlin', '/e2e/kotlin']
    schedule:
      interval: weekly
    ignore:
      # JUnit 6 needs JVM 17; the runtime's tests compile against its JVM 11 target.
      - dependency-name: 'org.junit:junit-bom'
        update-types: ['version-update:semver-major']
    groups:
      gradle:
        patterns: ['*']

  - package-ecosystem: gomod
    # Both modules use the standard library only; this keeps their `go` directive in view. The generated SDK's
    # version lives in packages/archon/src/plugins/go/project.ts (the plugin's client test checks they match).
    directories: ['/runtimes/go', '/e2e/go']
    schedule:
      interval: weekly
    groups:
      gomod:
        patterns: ['*']
