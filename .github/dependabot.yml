version: 2
updates:
  - package-ecosystem: github-actions
    # "/" also covers the local composite actions under .github/actions.
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: npm
    # pnpm workspace: the root lockfile covers every package.
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-development:
        dependency-type: development
      npm-production:
        dependency-type: production
