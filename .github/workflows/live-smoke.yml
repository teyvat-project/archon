name: Live smoke

# Calls the public api.natsuneko.com with an SDK generated from examples/natsuneko. Manual only, so pull
# requests never depend on (or hit) a third-party API.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: node --experimental-strip-types scripts/live-smoke.ts
