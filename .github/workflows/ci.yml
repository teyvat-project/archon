name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs are grouped per target language. A new language adds its own jobs (toolchain setup, build, E2E
# against the shared mock server) and lists them in `ci-ok` below.
jobs:
  # ---- Workspace (core + TypeScript plugin) ----

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm typecheck

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The C#, Kotlin and Swift compile tests build several generated SDKs.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # No Windows: the generator tests spawn `node_modules/.bin/tsc`, which is not portable there.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      # For the `dotnet build -warnaserror` compile tests of the C# output (skipped without a .NET 10 SDK).
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      # For the `gradle build` compile tests of the Kotlin output (skipped without JDK 17+).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      # The `swift build -warnings-as-errors` compile tests of the Swift output run with the runner's toolchain
      # (Xcode on macOS) and are skipped where there is no Swift 6.
      - run: swift --version || true
      # For the `cargo clippy` compile tests of the Rust output (skipped without cargo).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # For the `go vet` / `gofmt -l` compile tests of the Go output (skipped without Go).
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm -F @natsuneko-laboratory/archon build
      - name: Check the packed tarball contents
        working-directory: packages/archon
        run: |
          npm pack --dry-run --json --ignore-scripts > "$RUNNER_TEMP/pack.json"
          node -e '
            const [{ files }] = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const paths = files.map((f) => f.path);
            const required = ["dist/cli.js", "dist/index.js", "dist/index.d.ts", "dist/plugins.js", "dist/plugins.d.ts"];
            const missing = required.filter((p) => !paths.includes(p));
            for (const lang of ["typescript", "csharp", "kotlin", "swift", "rust", "go"]) {
              if (!paths.some((p) => p.startsWith(`runtimes/${lang}/`))) missing.push(`runtimes/${lang}/**`);
            }
            const leaked = paths.filter(
              (p) =>
                /^runtimes\/csharp\/.*(\.csproj$|\/(bin|obj)\/)/.test(p) ||
                /^runtimes\/kotlin\/(src\/test\/|.*\/(build|\.gradle)\/)/.test(p) ||
                /^runtimes\/swift\/.*(Package\.swift$|\/\.build\/)/.test(p) ||
                /^runtimes\/rust\/(tests\/|target\/|Cargo\.)/.test(p) ||
                /^runtimes\/go\/.*(_test\.go$|\/testdata\/)/.test(p),
            );
            if (leaked.length > 0) missing.push(`no build files (${leaked.join(", ")})`);
            console.log(paths.join("\n"));
            if (missing.length > 0) {
              console.error(`::error::package is missing ${missing.join(", ")}`);
              process.exit(1);
            }
          ' "$RUNNER_TEMP/pack.json"

  # ---- TypeScript SDK ----

  e2e-typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test:e2e

  # The generated SDK copies runtimes/typescript and claims Node.js 18+. Dependencies are installed with
  # the workspace's Node 24, then the runtime's own suite runs on each supported Node line.
  runtime-typescript-node:
    name: runtime-typescript (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --version && ./node_modules/.bin/vitest run
        working-directory: runtimes/typescript

  # Generates the edge-cases SDK and runs e2e/typescript/smoke/smoke.ts under Bun / Deno against the mock server.
  runtime-typescript-smoke:
    name: runtime-typescript (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2.0.5
      - run: ${{ matrix.runtime }} --version && pnpm -F @natsuneko-laboratory/archon-e2e-typescript smoke ${{ matrix.runtime }}

  # ---- C# SDK ----

  runtime-csharp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test runtimes/csharp/tests/Archon.Runtime.Tests

  # Generates the edge-cases SDK and runs the xUnit suite in e2e/csharp against the shared mock server.
  e2e-csharp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: pnpm test:e2e:csharp

  # ---- Kotlin SDK ----

  runtime-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: runtimes/kotlin/gradlew -p runtimes/kotlin test --console=plain

  # Generates the edge-cases SDK and runs the JUnit suite in e2e/kotlin against the shared mock server.
  e2e-kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: pnpm test:e2e:kotlin

  # ---- Swift SDK ----

  # The runtime's swift-testing suite, on Linux (FoundationNetworking) and macOS (Darwin Foundation).
  runtime-swift-linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: swift --version && swift test --package-path runtimes/swift

  runtime-swift-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: swift --version && swift test --package-path runtimes/swift

  # Generates the edge-cases SDK and runs the swift-testing suite in e2e/swift against the shared mock server.
  e2e-swift-linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test:e2e:swift

  e2e-swift-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - run: pnpm test:e2e:swift

  # ---- Go SDK ----

  # The generated SDK claims Go 1.22+: the runtime's own suite runs on 1.22 and on the latest release.
  runtime-go:
    name: runtime-go (${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', 'stable']
    defaults:
      run:
        working-directory: runtimes/go
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go version && go vet ./... && test -z "$(gofmt -l .)" && go test -race ./...

  # Generates the edge-cases SDK and runs the Go test suite in e2e/go against the shared mock server.
  e2e-go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false
      - run: pnpm test:e2e:go -race

  # ---- Rust SDK ----

  # The runtime's tests and lints on stable and on the rust-version the generated Cargo.toml declares.
  runtime-rust:
    name: runtime-rust (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, '1.88']
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtimes/rust
      - run: cargo test --manifest-path runtimes/rust/Cargo.toml
      - run: cargo clippy --manifest-path runtimes/rust/Cargo.toml --all-targets -- -D warnings
      - if: matrix.toolchain == 'stable'
        run: cargo fmt --manifest-path runtimes/rust/Cargo.toml --check

  # Generates the edge-cases SDK and runs the cargo test suite in e2e/rust against the shared mock server.
  e2e-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-workspace
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: e2e/rust
      - run: pnpm test:e2e:rust

  # Single required check for branch protection; add new jobs to `needs`.
  ci-ok:
    if: always()
    needs:
      - typecheck
      - test
      - build
      - e2e-typescript
      - runtime-typescript-node
      - runtime-typescript-smoke
      - runtime-csharp
      - e2e-csharp
      - runtime-kotlin
      - e2e-kotlin
      - runtime-swift-linux
      - runtime-swift-macos
      - e2e-swift-linux
      - e2e-swift-macos
      - runtime-rust
      - e2e-rust
      - runtime-go
      - e2e-go
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "all jobs succeeded"
