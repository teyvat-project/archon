# The runtime vendored into Rust SDKs generated by Archon (copied to `src/core/`). Its dependencies and versions
# must match packages/archon/src/plugins/rust/project.ts (the plugin's versions test checks them).
[package]
name = "archon-runtime"
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Runtime of the Rust SDKs generated by Archon."

[dependencies]
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", features = ["time", "sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync"] }

[features]
# The tests talk plain HTTP to a local server; generated SDKs default to rustls.
default = []
rustls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]
