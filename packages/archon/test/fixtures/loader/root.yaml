openapi: 3.0.3
info:
  title: Root
  version: 1.0.0
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: './external.yaml#/Pet'
  /pets/{id}:
    get:
      operationId: getPet
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: './external.yaml#/Pet'
components:
  schemas:
    Local:
      type: object
      properties:
        pet:
          $ref: '#/components/schemas/Other'
    Other:
      type: string
