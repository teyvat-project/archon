# End-to-end tests of the generated Rust SDK against e2e/mock-server; run with `pnpm test:e2e:rust`.
[package]
name = "archon-e2e-rust"
version = "0.0.0"
edition = "2021"
publish = false

[dev-dependencies]
# Generated by scripts/generate.mjs. The mock server speaks plain HTTP, so no TLS backend is built.
archon-edge-cases = { path = "generated/EdgeCases", default-features = false }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "sync"] }
